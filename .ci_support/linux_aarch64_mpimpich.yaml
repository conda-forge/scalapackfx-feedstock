DOCKER_PLATFORM:
- linux/aarch64
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
docker_image:
- quay.io/condaforge/linux-anvil-aarch64:alma10
fortran_compiler:
- gfortran
fortran_compiler_version:
- '15'
libblas:
- 3.9.* *netlib
liblapack:
- 3.9.* *netlib
mpi:
- mpich
mpich:
- '5'
openmpi:
- '5'
target_platform:
- linux-aarch64
